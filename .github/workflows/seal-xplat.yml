name: Seal Cross-Platform Build

on: workflow_dispatch

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "23"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@11.0.0 drops support for Node.js v18
      # Install the latest npm compatible with this version of Node.js
      # - npm@11.1.0 supports: {"node":"^20.17.0 || >=22.9.0"}
      - run: npm install -g npm@"<11.0.0"
        if: ${{
          matrix.node_version == '18.19.0' ||
          matrix.node_version == '18' ||
          matrix.node_version == '20.6.0'
          }}
      # npm@12 requires {"node":"^22.22.2 || ^24.15.0 || >=26"} and EBADENGINEs
      # on every leg below, so pin to the npm@11 line instead of npm@latest.
      - run: npm install -g npm@"<12.0.0"
        if: ${{
          matrix.node_version == '20' ||
          matrix.node_version == '22' ||
          matrix.node_version == '23'
          }}

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - run: npm test
        if: ${{ matrix.node_version != '22' && matrix.node_version != '23' }}
      # Node.js 23 type stripping conflicts with mocha usage of ts-node.
      # See https://github.com/open-telemetry/opentelemetry-js/issues/5415
      # Node.js 22.18+ enables native type stripping by default too, so the
      # '22' matrix leg now needs the same flag.
      - run: npm test
        env:
          NODE_OPTIONS: '--no-experimental-strip-types'
        if: ${{ matrix.node_version == '22' || matrix.node_version == '23' }}

  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '20'

      # npm@12 EBADENGINEs on Node.js 20; pin to the npm@11 line.
      # The default shell here is PowerShell, which treats a bare `<` as a
      # reserved redirection operator, so the npm@"<12.0.0" range form used on
      # the Linux legs fails to spawn. Use an explicit major instead
      # (npm@11 requires node ^20.17.0 || >=22.9.0; the runner resolves 20.x).
      - run: npm install -g npm@11

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run test

  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '22'

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Pack @opentelemetry/core
        run: |
          mkdir -p seal-artifacts
          npm pack --workspace=packages/opentelemetry-core --pack-destination=seal-artifacts
          mv seal-artifacts/opentelemetry-core-2.0.0.tgz seal-artifacts/core-2.0.0.tgz
          ls -l seal-artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-2.0.0-tgz
          path: seal-artifacts/core-2.0.0.tgz
          if-no-files-found: error
